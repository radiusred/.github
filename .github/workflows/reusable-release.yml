name: Reusable Release Template

on:
  workflow_call:
    inputs:
      approval_environment:
        type: string
        required: true
    secrets:
      RELEASE_APP_CLIENT_ID:
        required: false
      RELEASE_APP_PRIVATE_KEY:
        required: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    outputs:
      bump_type: ${{ steps.calc.outputs.bump_type }}
      new_tag: ${{ steps.calc.outputs.new_tag }}
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID || 'Iv23liJJ7akrgLiP3Kti' }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Calculate Version
        id: calc
        uses: radiusred/.github/.github/actions/calculate_version@main

  gate:
    name: Approval Checkpoint
    needs: analyze
    runs-on: ubuntu-latest
    environment: ${{ inputs.approval_environment }}
    steps:
      - run: echo "Approved."

  # Opens (or resumes) the release PR and enables auto-merge, then exits
  # immediately. The runner no longer idles in a poll loop waiting for the merge
  # (that billed wall-clock for up to an hour). Tagging and publishing the GitHub
  # release happen in the consuming repo's finalize-release workflow, which is
  # triggered when the release PR is merged (see reusable-finalize-release.yml).
  execute:
    needs: [analyze, gate]
    runs-on: ubuntu-latest
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID || 'Iv23liJJ7akrgLiP3Kti' }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Skip if Already Released
        id: detect
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NEW_TAG: ${{ needs.analyze.outputs.new_tag }}
        run: |
          set -euo pipefail
          if gh release view "$NEW_TAG" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release ${NEW_TAG} already exists; nothing to open."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump Version on Release Branch
        if: steps.detect.outputs.skip != 'true'
        id: bump
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NEW_TAG: ${{ needs.analyze.outputs.new_tag }}
        run: |
          set -euo pipefail
          BRANCH="release/${NEW_TAG}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            # A prior run already cut this release branch. This is the normal
            # "re-run after the release PR was opened but not yet merged" case,
            # so resume instead of failing: reuse the existing branch and let
            # the Open Release PR / Enable Auto-Merge steps pick up the open PR.
            # Do NOT delete the branch — that would close the in-flight release PR.
            echo "::notice::Release branch $BRANCH already exists on origin; resuming with the existing branch and its open release PR."
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git checkout -b "$BRANCH"
          python3 - << 'PYEOF'
          import tomllib, re, os
          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)
          version_file = data["tool"]["hatch"]["version"]["path"]
          new_ver = os.environ["NEW_TAG"].lstrip("v")
          content = open(version_file).read()
          new_content = re.sub(r'(__version__\s*=\s*")[^"]*(")', f'\\g<1>{new_ver}\\2', content)
          with open(version_file, "w") as f:
              f.write(new_content)
          PYEOF
          git add -A
          if git diff --cached --quiet; then
            echo "::error::Version file already at ${NEW_TAG} but no release exists. The release branch was likely merged and deleted while finalize did not run. Re-run the consuming repo's finalize-release workflow (workflow_dispatch) to tag and publish." >&2
            exit 1
          fi
          git commit -m "chore: release ${NEW_TAG}"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open Release PR
        if: steps.detect.outputs.skip != 'true'
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NEW_TAG: ${{ needs.analyze.outputs.new_tag }}
          BRANCH: ${{ steps.bump.outputs.branch }}
        run: |
          set -euo pipefail
          # Reuse an existing open release PR if one is already present (resumed
          # run), otherwise open a fresh one. Keeps re-runs idempotent.
          PR_NUMBER=$(gh pr list --head "$BRANCH" --base main --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$PR_NUMBER" ]; then
            PR_URL=$(gh pr view "$PR_NUMBER" --json url --jq .url)
            echo "::notice::Reusing existing open release PR #$PR_NUMBER for $BRANCH."
          else
            PR_URL=$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore: release ${NEW_TAG}" \
              --body "Automated release bump for ${NEW_TAG}. Reviewer: please approve; the PR will rebase-merge automatically once approved (auto-merge), and the finalize-release workflow will then tag and publish the GitHub release.")
            PR_NUMBER=$(gh pr view "$PR_URL" --json number --jq .number)
          fi
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Enable Auto-Merge
        if: steps.detect.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
        run: |
          set -euo pipefail
          # Enable auto-merge so the PR rebase-merges on its own once the required
          # human approval (and any required checks) land. Best-effort: if the
          # repo does not have auto-merge enabled, fall back to a manual merge
          # notice. Either way the runner exits now instead of idling, and the
          # finalize-release workflow tags + publishes whenever the PR merges.
          if gh pr merge "$PR_NUMBER" --auto --rebase; then
            echo "::notice::Auto-merge enabled on ${PR_URL}. It will rebase-merge once approved."
          else
            echo "::warning::Could not enable auto-merge on ${PR_URL} (is 'Allow auto-merge' enabled on this repo?). Approve and rebase-merge it manually; the finalize-release workflow will then tag and publish."
          fi
